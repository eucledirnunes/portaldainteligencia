name: Pipeline editorial (coleta -> eventos -> artigos)

# O estado vive no Supabase, lido pelo site a cada requisição (Next.js/Vercel) — este workflow
# NÃO precisa commitar nada no repositório para o site "atualizar": basta rodar o pipeline.
# Requer os secrets abaixo configurados em Settings > Secrets and variables > Actions do repositório.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # todo início de hora (UTC) — cobre também as 10h de Brasília em diante

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Coleta
        run: npm run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
      - name: Eventos
        run: npm run events
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Editorial
        run: npm run editorial
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITORIAL_AUTO_PUBLISH: ${{ vars.EDITORIAL_AUTO_PUBLISH }}
